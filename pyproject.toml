[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathpilot"
version = "0.1.0"
description = "An interactive AI navigation game and ML engineering project."
readme = "README.md"
requires-python = ">=3.10"
# pygame-ce provides the Pygame API and supports the project's Python 3.10+
# range, including Python 3.14 used by the development environment.
dependencies = ["pygame-ce>=2.5,<3"]

[project.scripts]
pathpilot = "pathpilot.game:main"
pathpilot-benchmark = "pathpilot.evaluation.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]



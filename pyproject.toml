[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathpilot"
version = "0.1.0"
description = "An interactive AI navigation game and ML engineering project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]


